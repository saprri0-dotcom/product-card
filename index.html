<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Cards</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="catalog">
      <h1 class="catalog__title">Выбери свой продукт</h1>
      <div class="catalog__buttons">
        <button id="change-color-card-button">Изменить цвет карты</button>
        <button id="change-color-all-cards-button">
          Изменить цвет всех карт
        </button>
        <button id="open-google">Открыть страницу Google.com</button>
        <button id="output-console-log">Вывести сообщение в консоль лог</button>
      </div>
      <div class="catalog__list" id="product-list"></div>
    </div>
    <template id="product-template">
  <div class="card">
    <div class="card__image">
      <img class="card__image-item" src="" alt="" />
    </div>
    <span class="card__skin"></span>
    <h2 class="card__title"></h2>
    <p class="card__description"></p>
    <div class="card__compound">
      <span class="card__label">Состав:</span>
      <ul class="card__ingredients"></ul>
    </div>
    <div class="card__price">
      <span class="card__price-label">Цена</span>
      <span class="card__price-value"></span>
    </div>
  </div>
</template>
    <script src="main.js" defer></script>
    <script src="homework-7.js"></script>
    <script src="homework-8.js"></script>
    <script type="module" src="homework-9.js"></script>
    <script type="module" src="homework-10.js"></script>
  </body>
</html>
